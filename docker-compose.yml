services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-agent-api
    ports:
      - "8000:8000"
    volumes:
      - /mnt/ssd2/downloads/jmbadpt_20251121/file:/workspace/rag_agent/documents/static:ro
      - ./.env:/workspace/rag_agent/.env:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_CACHE=/workspace/rag_agent/.cache
      - HF_HOME=/workspace/rag_agent/.cache
      - LANG=ko_KR.UTF-8
      - LC_ALL=ko_KR.UTF-8
      - LANGUAGE=ko_KR:ko

    # 🆕 DNS 적용
    dns:
      - 8.8.8.8
      - 1.1.1.1

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: bridge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

